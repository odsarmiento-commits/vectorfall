name: Godot 4.6 CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.6.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o /tmp/godot.zip             https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          BIN="$(find /tmp/godot -maxdepth 1 -type f -name 'Godot_v4.6.3-stable_linux.x86_64*' | head -n1)"
          chmod +x "$BIN"
          ln -s "$BIN" /tmp/godot/godot
          /tmp/godot/godot --version

      - name: Import and parse project
        run: /tmp/godot/godot --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Smoke tests
        run: /tmp/godot/godot --headless --path "$GITHUB_WORKSPACE" --script res://tests/ci_smoke.gd

      - name: Boot main scene
        run: /tmp/godot/godot --headless --path "$GITHUB_WORKSPACE" --quit-after 120
